services:

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: linkedin-jenkins

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      - TZ=Asia/Singapore

    volumes:
      - ${JENKINS_HOME_DIR:-./home}:/var/jenkins_home

    restart: unless-stopped


  jenkins-agent:
    build:
      context: ./agent

    container_name: synology-docker-agent

    env_file:
      - agent.env
  
    environment:
      LINKEDIN_PROJECT_DIR: ${LINKEDIN_PROJECT_DIR:?Set absolute project directory}

    group_add:
      - "0"

    volumes:
      - ${JENKINS_AGENT_DIR:-./agent-work}:/home/jenkins/agent

      # Allows agent to run Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Allows agent to see LinkedIn project
      - ${LINKEDIN_PROJECT_DIR:?Set absolute project directory}:${LINKEDIN_PROJECT_DIR:?Set absolute project directory}

    depends_on:
      - jenkins

    restart: unless-stopped
